# Marker definitions for ba_autocalib.
# Balanced configuration: catch lila shadows but avoid background noise.

markers:
  grasp:
    tf_frame: marker_grasp
    hsv_lower: [150, 40, 25]
    hsv_upper: [20, 255, 255]
    hsv_lower_strict: [160, 90, 50]
    hsv_upper_strict: [10, 255, 255]
    min_area_px: 250
    max_area_px: 3000
    close_kernel_px: 11
    min_compactness: 0.45
  forearm:
    tf_frame: marker_forearm
    hsv_lower: [12, 100, 50]
    hsv_upper: [35, 255, 255]
    hsv_lower_strict: [17, 160, 80]
    hsv_upper_strict: [32, 255, 255]
    min_area_px: 250
    max_area_px: 2500
    close_kernel_px: 11
    min_compactness: 0.50
  base:
    tf_frame: marker_base
    hsv_lower: [95, 100, 60]
    hsv_upper: [125, 255, 255]
    hsv_lower_strict: [100, 130, 80]
    hsv_upper_strict: [120, 255, 255]
    min_area_px: 250
    max_area_px: 1500
    close_kernel_px: 9
    min_compactness: 0.55
